<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <style>
    :root {
      --cnch-azul: #1c3d5a;
      --cnch-verde: #4d8d8a;
      --cnch-crema: #E1E1E1;
      --cnch-oro: #74757A;
      --cnch-azul-hover: #153047;
      --cnch-verde-hover: #3d716e;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      transition: background 0.5s ease;
    }

    .modo-login {
      background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://lh3.googleusercontent.com/pw/AP1GczNkvnt2EH1t0ooqZS9oBItnrs3ij8RS3GQN_S2WvZAIBM0w6T8tEvljUB1JZNHmwGFXhccWBV60hI6pQ63O1XqQscpRfzJzBA8yZMBIchPwaHtFm3DBQUHNmA2NQ53xW7NuThO9s7CmiFzvDtQDQJ6mmA=w1920-h923-s-no-gm?authuser=0');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }

    .modo-app {
      background-color: #fdfaf5;
    }

    .banner-hero {
      background-color: var(--cnch-crema);
      padding: 30px 0 100px 0;
      border-bottom: 5px solid var(--cnch-oro);
    }

    .logo-espacio img {
      max-height: 100px;
      width: auto;
    }

    .info-usuario h2,
    h3 {
      color: var(--cnch-azul);
      font-weight: 700;
      margin: 0;
    }

    .info-usuario .cargo-txt {
      color: var(--cnch-oro);
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .contenedor-flotante {
      margin-top: -70px;
      margin-bottom: 50px;
    }

    .tarjeta-moderna {
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      padding: 40px;
    }

    .btn-cnch-verde {
      background-color: var(--cnch-verde);
      color: white;
      border-radius: 20px;
      padding: 10px 25px;
      border: none;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-cnch-verde:hover {
      background-color: var(--cnch-verde-hover);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(77, 141, 138, 0.4);
    }

    .btn-cnch-azul {
      background-color: var(--cnch-azul);
      color: white;
      border-radius: 20px;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-cnch-azul:hover {
      background-color: var(--cnch-azul-hover);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(28, 61, 90, 0.4);
    }

    .btn-cnch-cerrar {
      background-color: #B4B7BC;
      color: white;
      border-radius: 20px;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-cnch-cerrar:hover {
      background-color: #969799;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(28, 61, 90, 0.4);
    }

    .seccion {
      display: none;
    }

    .activo {
      display: block;
      animation: fadeInUp 0.5s ease;
    }

    .campo {
      text-transform: none;
    }

    .select2-container--default .select2-selection--single {
      border: 1px solid #ced4da;
      height: 38px;
      border-radius: 5px;
    }

    .select2-container {
      width: 100% !important;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="modo-login" id="cuerpoPagina">

  <div id="vistaAcceso" class="seccion activo">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card p-5 text-center shadow-lg" style="max-width: 400px; border-radius: 20px;">
        <img
          src="https://lh3.googleusercontent.com/pw/AP1GczPHohAB1rG8UUI7V7IbUfLIVbNB2RzXQacFiGGYNrDaKYAJMovzAXz_hoaN4PWzCPAOCP8lbwWH1jzgmXVCcBDDEtXA1i9O6Zfnq3OweFe6hVqpZOBGmjfx3l71cY_Qwnm7L8EYTEglJDSA-DzxjQUK=w635-h305-s-no-gm?authuser=0"
          class="text-cnch-azul mb-4 fw-bold">
        <input type="text" id="cedulaInput" class="form-control mb-3 text-center" placeholder="Escriba aquí su cédula">
        <button onclick="iniciarSesion()" id="btnIngresar" class="btn btn-cnch-verde w-100">Ingresar</button>
      </div>
    </div>
  </div>

  <div id="vistaApp" class="seccion">
    <header class="banner-hero">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="logo-espacio">
          <img
            src="https://lh3.googleusercontent.com/pw/AP1GczPHohAB1rG8UUI7V7IbUfLIVbNB2RzXQacFiGGYNrDaKYAJMovzAXz_hoaN4PWzCPAOCP8lbwWH1jzgmXVCcBDDEtXA1i9O6Zfnq3OweFe6hVqpZOBGmjfx3l71cY_Qwnm7L8EYTEglJDSA-DzxjQUK=w635-h305-s-no-gm?authuser=0"
            alt="Logo">
        </div>
        <div class="info-usuario text-end">
          <h2 id="txtNombre">Cargando...</h2>
          <p id="txtCargo" class="cargo-txt"></p>
          <p id="txtGerencia" class="cargo-txt"></p>
        </div>
      </div>
    </header>

    <div class="container contenedor-flotante">
      <div class="tarjeta-moderna">
        <div id="subVistaListado">
          <div class="d-flex  info-usuario justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-cnch-azul">Proyectos Postulados en la Gerencia</h3>
            <button onclick="mostrarFormulario()" class="btn btn-cnch-verde">+ Postular Proyecto</button>
          </div>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>Título</th>
                  <th>Postulante</th>
                  <th>Fecha de postulación</th>
                </tr>
              </thead>
              <tbody id="tablaProyectos"></tbody>
            </table>
          </div>
        </div>

        <div id="subVistaFormulario" class="seccion">
          <div class="d-flex justify-content-between align-items-start mb-4">
            <h3 class="fw-bold text-cnch-azul mb-0">Formulario para postulación de Proyectos</h3>
            <button type="button" class="btn-close shadow-none" aria-label="Close" onclick="volverAListado()"></button>
          </div>
          <form id="formProyecto" onsubmit="event.preventDefault(); procesarEnvio();">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Escriba su celular <strong style="color:red">*</strong></label><input
                  type="text" id="celular" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Título del proyecto (Máximo 40 caracteres) <strong
                    style="color:red">*</strong></label><input type="text" id="titulo" class="form-control campo"
                  maxlength="40" oninput="corregirMayusculas(this)" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Categoría <strong style="color:red">*</strong></label><select id="cat"
                  class="form-select" onchange="cargarSubcats()" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Subcategoría <strong style="color:red">*</strong></label><select id="subcat"
                  class="form-select" required disabled></select>
              </div>
              <div class="col-12">
                <label class="form-label">Descripción breve del proyecto (Máximo 1000 caracteres)<strong
                    style="color:red">*</strong></label><textarea id="desc" class="form-control campo" rows="3"
                  maxlength="1000" oninput="corregirMayusculas(this)" required></textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label">Fecha de implementación del proyecto <strong
                    style="color:red">*</strong></label><input type="month" id="fecha" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Generación de valor (Económico) <strong
                    style="color:red">*</strong></label><input type="number" id="ben" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Moneda del valor económico <strong style="color:red">*</strong></label>
                <select id="mon" class="form-select" required>
                  <option value="Dólares">Dólares (USD)</option>
                  <option value="Pesos Colombianos">Pesos Colombianos(COP)</option>
                  <option value="Soles">Soles (PEN)</option>
                  <option value="Colones">Colones (CRC)</option>
                </select>
              </div>
              <div class="col-12 mt-3">
                <label class="form-label">Generación de valor (No económico alineado a los retos del negocio - Máximo
                  300 caracteres):<strong style="color:red">*</strong> </label><textarea id="noeco"
                  class="form-control campo" rows="2" maxlength="300" oninput="corregirMayusculas(this)"
                  required></textarea>
              </div>
              <div class="col-12 mt-4">
                <h4 class="text-cnch-verde pb-2 font-bold">Integrantes <strong style="color:red">*</strong></h4>
                <p class="text-cnch-verde border-bottom pb-2">Recuerda priorizar las 10 personas que más participaron
                  en el proyecto.</p>
                <div id="gridIntegrantes" class="row g-2"></div>
              </div>
              <div class="col-12 mt-3">
                <label class="form-label">Observaciones (Máximo 300 caracteres): </label><textarea id="obs"
                  class="form-control campo" rows="2"
                  placeholder="Este campo aplica para comentarios adicionales que tengas o si deseas postular un participante de México"
                  maxlength="300" oninput="corregirMayusculas(this)"></textarea>
              </div>
              <div class="col-12 text-end mt-4">
                <button type="button" onclick="volverAListado()" class="btn btn-cnch-cerrar px-5">Cancelar</button>
                <button type="submit" id="btnEnviar" class="btn btn-cnch-azul px-5">Enviar</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    let SESION = null;

    function mostrarCargando(msj) {
      Swal.fire({ title: msj, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
    }

    function iniciarSesion() {
      const ced = document.getElementById('cedulaInput').value.trim();
      if (!ced) return Swal.fire('Atención', 'Recuerde que debe ingresar su cédula/documento de identidad', 'warning');
      mostrarCargando('Cargando...');

      google.script.run
        .withSuccessHandler(res => {
          if (!res || !res.usuario) {
            Swal.fire('Error', 'No se recibieron datos del usuario.', 'error');
            return;
          }
          Swal.close();
          SESION = res;
          configurarApp();
        })
        .withFailureHandler(err => {
          Swal.fire('Acceso Denegado', err.message, 'error');
        })
        .validarAcceso(ced);
    }

    function configurarApp() {
      if (!SESION) return;
      document.getElementById('cuerpoPagina').className = 'modo-app';
      document.getElementById('vistaAcceso').classList.remove('activo');
      document.getElementById('vistaApp').classList.add('activo');

      const u = SESION.usuario;
      document.getElementById('txtNombre').innerText = '¡Hola, ' + u.nombre.split(' ')[0] + '!';
      document.getElementById('txtCargo').innerText = u.cargo;
      document.getElementById('txtGerencia').innerText = u.gerencia;

      dibujarTabla(SESION.proyectos || []);
      prepararSelects();
    }

    function prepararSelects() {
      const c = document.getElementById('cat');
      c.innerHTML = '<option value="">Seleccione Categoría...</option>';
      if (SESION.categorias) {
        Object.keys(SESION.categorias).forEach(k => {
          c.innerHTML += `<option value="${k}">${k}</option>`;
        });
      }

      const grid = document.getElementById('gridIntegrantes');
      grid.innerHTML = '';

      const opts = (SESION.integrantes || []).map(i => `<option value="${i}">${i}</option>`).join('');

      for (let i = 1; i <= 10; i++) {
        grid.innerHTML += `
            <div class="col-md-6 mb-3">
                <label class="small fw-bold">Participante ${i}*</label>
                <select id="integ_${i}" class="form-select buscador-select">
                    <option value="">Buscar por nombre o cargo...</option>
                    ${opts}
                </select>
            </div>`;
      }

      $('.buscador-select').select2({
        placeholder: "Escriba para buscar...",
        allowClear: true,
        language: {
          noResults: function () { return "No se encontraron coincidencias"; }
        }
      });
    }

    function cargarSubcats() {
      const cat = document.getElementById('cat').value;
      const sub = document.getElementById('subcat');
      sub.innerHTML = '<option value="">Seleccione...</option>';
      if (cat && SESION.categorias[cat]) {
        SESION.categorias[cat].forEach(s => sub.innerHTML += `<option value="${s}">${s}</option>`);
        sub.disabled = false;
      } else { sub.disabled = true; }
    }



    function dibujarTabla(proyectos) {
      const body = document.getElementById('tablaProyectos');

      if (!Array.isArray(proyectos)) {
        console.warn("Se recibió un valor nulo o inválido en dibujarTabla. Ajustando a arreglo vacío.");
        proyectos = [];
      }

      body.innerHTML = proyectos.map(p => {
        const fechaObj = p.fecha ? new Date(p.fecha) : new Date();
        const fechaFormateada = isNaN(fechaObj) ? "Fecha inválida" : fechaObj.toLocaleDateString();

        return `<tr>
                  <td>${p.titulo || 'Sin título'}</td>
                  <td>${p.autor || 'N/A'}</td>
                  <td>${fechaFormateada}</td>
                </tr>`;
      }).join('') || '<tr><td colspan="3" class="text-center">Aún no se han postulado proyectos.</td></tr>';
    }

    function mostrarFormulario() { document.getElementById('subVistaListado').style.display = 'none'; document.getElementById('subVistaFormulario').classList.add('activo'); }
    function volverAListado() { document.getElementById('subVistaFormulario').classList.remove('activo'); document.getElementById('subVistaListado').style.display = 'block'; }

    function corregirMayusculas(elemento) {
      let texto = elemento.value;
      if (texto.length > 0) {
        elemento.value = texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
      }
    }
    function procesarEnvio() {
      mostrarCargando('Guardando...');
      const payload = {
        cedula: SESION.usuario.cedula, nombre: SESION.usuario.nombre, gerencia: SESION.usuario.gerencia,
        celular: document.getElementById('celular').value, titulo: document.getElementById('titulo').value,
        categoria: document.getElementById('cat').value, subcategoria: document.getElementById('subcat').value,
        descripcion: document.getElementById('desc').value, fechaImpl: document.getElementById('fecha').value,
        beneficio: document.getElementById('ben').value, moneda: document.getElementById('mon').value,
        intangible: document.getElementById('noeco').value,
        integrantes: Array.from({ length: 10 }, (_, i) => document.getElementById(`integ_${i + 1}`).value),
        observaciones: document.getElementById('obs').value
      };
      google.script.run
        .withSuccessHandler(actualizados => {
          Swal.fire('¡Éxito!', 'Tu proyecto fue postulado correctamente.', 'success');
          document.getElementById('formProyecto').reset();
          dibujarTabla(actualizados);
          volverAListado();
        })
        .guardarNuevoProyecto(payload);
    }
  </script>
</body>

</html>
